services:
  localstack:
    image: localstack/localstack:4.4
    container_name: localstack
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
    ports:
      - '4566:4566'
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=verdaccio
      - POSTGRES_PASSWORD=verdaccio
      - POSTGRES_DB=verdaccio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'verdaccio']
      interval: 5s
      timeout: 5s
      retries: 10

  init-resources:
    image: amazon/aws-cli:latest
    container_name: init-resources
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - aws --endpoint-url http://localstack:4566 s3 mb s3://verdaccio-storage 2>/dev/null || true

  verdaccio:
    container_name: verdaccio
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      init-resources:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_S3_BUCKET=verdaccio-storage
      - AWS_S3_KEY_PREFIX=packages
      - AWS_S3_ENDPOINT=http://localstack:4566
      - DATABASE_URL=postgres://verdaccio:verdaccio@postgres:5432/verdaccio
      - DEBUG=verdaccio:plugin*
    ports:
      - '4873:4873'

volumes:
  localstack-data:
  postgres-data:
