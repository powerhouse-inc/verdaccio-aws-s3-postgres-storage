name: Changesets

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  NPM_CONFIG_PROVENANCE: 'true'

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or refreshes the "build: release packages" PR while changesets are pending
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'powerhouse-inc/verdaccio-aws-s3-postgres-storage'
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: create versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # A PAT lets the version PR trigger CI; GITHUB_TOKEN works but skips it
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: pnpm ci:version
          commit-message: 'build: release packages'
          pr-title: 'build: release packages'

  # Publishes once the version PR is merged and no changesets are left
  publish:
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    timeout-minutes: 14
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate publishing
    environment: npm
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
      # Trusted publishing (OIDC); a new package's first version is published by hand
      - name: publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm ci:publish
          create-github-releases: true
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
