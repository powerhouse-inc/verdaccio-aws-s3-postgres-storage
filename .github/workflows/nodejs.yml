name: Node CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:4.4
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          VERDACCIO_S3_STORAGE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          VERDACCIO_S3_STORAGE_TEST_S3_ENDPOINT: http://localhost:4566
          VERDACCIO_S3_STORAGE_TEST_S3_ACCESS_KEY: test
          VERDACCIO_S3_STORAGE_TEST_S3_SECRET_KEY: test

      - name: Verify ESM output
        run: |
          node -e "
            import('fs').then(fs => {
              const esm = fs.readFileSync('./lib/index.js', 'utf8');
              if (!esm.includes('S3Database') || !esm.includes('S3PackageManager')) process.exit(1);
              if (!fs.existsSync('./lib/s3DatabasePostgres.js')) process.exit(1);
              if (!esm.includes('export {')) process.exit(1);
              console.log('ESM bundle verified');
            });
          "

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm cypress install

      - name: Build Docker image
        run: docker compose build verdaccio

      - name: Start services
        run: docker compose up -d

      - name: Wait for Verdaccio
        run: |
          for i in $(seq 1 30); do
            pnpm verdaccioctl ping -r http://localhost:4873 && exit 0
            sleep 2
          done
          docker compose logs verdaccio
          exit 1

      - name: Verify plugin loaded
        run: |
          # Give verdaccio a moment to log all startup messages
          sleep 5
          docker compose logs verdaccio 2>&1
          docker compose logs verdaccio 2>&1 | grep -q "verdaccio-s3-storage"

      - name: E2E - login check
        run: |
          pnpm verdaccioctl login -u test -p test1234 -r http://localhost:4873
          pnpm verdaccioctl whoami -r http://localhost:4873

      - name: E2E UI - publish tests (Cypress)
        run: pnpm e2e:ui:run
        env:
          VERDACCIO_URL: http://localhost:4873

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7

      # after Cypress on purpose: the UI detail suite opens the first package in the
      # list, and the battery leaves dozens of them behind
      - name: E2E - registry battery (@verdaccio/e2e-cli)
        run: pnpm e2e:registry --pm npm --pm pnpm

      - name: Verdaccio logs on failure
        if: failure()
        run: docker compose logs verdaccio

      - name: Stop services
        if: always()
        run: docker compose down -v
